<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightshift 手机端 v2 效果稿</title>
<style>
  /* ---------- design tokens (§97.5 H1) ---------- */
  .dark {
    --bg: #0A0A0A; --surface: #141414; --surface-2: #1C1C1C;
    --hairline: rgba(255,255,255,0.08); --text: #F5F5F5; --muted: #A3A3A3; --dim: #737373;
    --primary-bg: #F5F5F5; --primary-fg: #0A0A0A; --float-shadow: none;
  }
  .light {
    --bg: #FFFFFF; --surface: #F5F5F5; --surface-2: #EDEDED;
    --hairline: rgba(0,0,0,0.08); --text: #0A0A0A; --muted: #525252; --dim: #8A8A8A;
    --primary-bg: #0A0A0A; --primary-fg: #FFFFFF; --float-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  :root { --brand: #7C5CFF; --green: #22C55E; --amber: #F59E0B; --red: #EF4444;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, monospace; }

  /* ---------- page ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: #2a2a2a; color: #eee; padding: 32px 16px 64px; }
  h1.page { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 6px; }
  p.page { font-size: 13px; color: #aaa; text-align: center; margin-bottom: 28px; }
  .row-label { font-size: 13px; color: #bbb; margin: 28px auto 12px; max-width: 1640px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; max-width: 1640px; margin: 0 auto; }
  .cap { font-size: 12px; color: #aaa; text-align: center; margin-top: 8px; }

  /* ---------- phone frame ---------- */
  .phone { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text); box-shadow: 0 0 0 10px #111, 0 20px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column; font-size: 15px; line-height: 1.55; }
  .status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; font-size: 14px; font-weight: 600; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .status .bat { width: 24px; height: 11px; border: 1.5px solid var(--text); border-radius: 3px; position: relative; opacity: .9; }
  .status .bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: var(--text); border-radius: 1px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px;
    border-radius: 999px; background: var(--text); opacity: .9; }
  svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- common pieces ---------- */
  .gutter { padding: 0 20px; }
  .large-title { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .sub { font-size: 13px; color: var(--muted); }
  .btn { height: 52px; border-radius: 999px; border: 0; font: 600 15px var(--sans); display: flex;
    align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn-primary { background: var(--primary-bg); color: var(--primary-fg); }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-sm { height: 44px; border-radius: 12px; font-size: 15px; }
  .btn-line { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--hairline); }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .dot.on { background: var(--green); } .dot.off { background: var(--dim); }
  .chev { color: var(--dim); }
  .group { background: var(--surface); border-radius: 16px; overflow: hidden; }
  .cell { display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 52px; }
  .cell + .cell { box-shadow: inset 0 1px 0 var(--hairline); }
  .cell .grow { flex: 1; min-width: 0; }
  .cell .val { font-size: 13px; color: var(--muted); }
  .group-title { font-size: 13px; color: var(--muted); padding: 0 16px 8px; }
  .local-note { font-size: 12px; color: var(--dim); padding: 8px 16px 0; }

  /* ---------- top bar ---------- */
  .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; }
  .topbar .ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .topbar .ttl b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 4px; }
  .topbar .ttl span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--surface-2); display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text); }

  /* ---------- chat ---------- */
  .chat { flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 20px; }
  .msg-user { align-self: flex-end; max-width: 80%; background: var(--surface-2); border-radius: 20px;
    padding: 10px 16px; }
  .msg-bot p + p, .msg-bot p + ul, .msg-bot ul + p { margin-top: 10px; }
  .msg-bot ul { padding-left: 20px; } .msg-bot li { margin-top: 2px; }
  code { font-family: var(--mono); font-size: 13px; background: var(--surface); border-radius: 6px; padding: 1px 6px; }
  .tool-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; padding: 2px 0; }
  .tool-row .grow { flex: 1; }
  .approve { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .approve h4 { font-size: 15px; font-weight: 600; }
  .approve .path { font-family: var(--mono); font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .approve .acts { display: flex; gap: 10px; margin-top: 10px; }
  .approve .acts .btn { flex: 1; }
  .composer { flex: none; padding: 10px 16px 30px; }
  .composer .pill { height: 52px; border-radius: 999px; background: var(--surface); display: flex;
    align-items: center; gap: 4px; padding: 0 8px 0 6px; box-shadow: var(--float-shadow); }
  .composer .ph { flex: 1; color: var(--dim); padding-left: 4px; }
  .send { width: 36px; height: 36px; border-radius: 999px; background: var(--primary-bg); color: var(--primary-fg);
    display: flex; align-items: center; justify-content: center; }
  .readaloud { font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; }
  .readaloud svg.i { width: 14px; height: 14px; }

  /* ---------- screen preview ---------- */
  .screen { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; position: relative;
    background: radial-gradient(120% 90% at 30% 20%, #1d3557 0%, #0b1320 60%, #05070b 100%); }
  .screen .win { position: absolute; left: 14%; top: 18%; width: 58%; height: 52%; border-radius: 6px;
    background: #f1f1f1; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .screen .win::before { content: ""; display: block; height: 14px; background: #d9d9d9; border-radius: 6px 6px 0 0; }
  .screen .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: rgba(0,0,0,.55); }
  .screen .hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); font-size: 12px;
    color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .seg { display: flex; gap: 24px; padding: 0 20px; height: 44px; align-items: center; font-size: 15px; color: var(--muted); }
  .seg b { color: var(--text); font-weight: 600; position: relative; }
  .seg b::after { content: ""; position: absolute; left: 0; right: 0; bottom: -11px; height: 2px; background: var(--text); border-radius: 2px; }
  .kv { display: flex; gap: 10px; }
  .kv .btn { flex: 1; }
  .keys { display: flex; gap: 8px; flex-wrap: wrap; }
  .key { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .scan-link { text-align: center; font-size: 15px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<h1 class="page">Nightshift 手机端 v2 · 效果稿</h1>
<p class="page">只换外观，按钮、文字、功能都不变。上排深色，下排浅色；四屏依次是：选机器、聊天（含工具与审批）、设置、看屏 / 接管。</p>

<template id="t-machines">
  <div class="status"><span>9:41</span><span class="r"><span class="bat"></span></span></div>
  <div class="gutter" style="padding-top:28px">
    <div class="large-title">选择机器</div>
    <div class="sub" style="margin-top:6px">点一台就进去。离线的那台会标出来，开机后再点即可。</div>
  </div>
  <div class="gutter" style="margin-top:28px">
    <div class="group">
      <div class="cell" style="min-height:64px"><span class="dot on"></span><div class="grow"><div style="font-weight:500;font-size:16px">我的电脑</div><div class="sub">局域网 · 在线</div></div><svg class="i chev"><use href="#chev-r"/></svg></div>
      <div class="cell" style="min-height:64px"><span class="dot on"></span><div class="grow"><div style="font-weight:500;font-size:16px">Ubuntu</div><div class="sub">Tailscale · 在线</div></div><svg class="i chev"><use href="#chev-r"/></svg></div>
      <div class="cell" style="min-height:64px"><span class="dot on"></span><div class="grow"><div style="font-weight:500;font-size:16px">win11</div><div class="sub">外网 · 在线</div></div><svg class="i chev"><use href="#chev-r"/></svg></div>
      <div class="cell" style="min-height:64px;opacity:.55"><span class="dot off"></span><div class="grow"><div style="font-weight:500;font-size:16px">Rocky</div><div class="sub">离线 · 开机后再点</div></div><svg class="i chev"><use href="#chev-r"/></svg></div>
    </div>
    <div class="local-note">长按一行可以删除它。进去之后左上角还能再切换机器。</div>
  </div>
  <div style="flex:1"></div>

<template id="t-chat">
  <div class="status"><span>9:41</span><span class="r"><span class="bat"></span></span></div>
  <div class="topbar">
    <span class="icon-btn"><svg class="i"><use href="#menu"/></svg></span>
    <div class="ttl"><b>助理</b><span><span class="dot on" style="width:6px;height:6px"></span>Ubuntu<svg class="i" style="width:14px;height:14px"><use href="#chev-d"/></svg></span></div>

<template id="t-screen">
  <div class="status"><span>9:41</span><span class="r"><span class="bat"></span></span></div>
  <div class="topbar">
    <span class="icon-btn"><svg class="i"><use href="#chev-l"/></svg></span>
    <div class="ttl"><b>电脑</b><span><span class="dot on" style="width:6px;height:6px"></span>Ubuntu · 实时画面</span></div>
    <span class="icon-btn"><svg class="i"><use href="#x"/></svg></span>

  <div class="seg"><b>电脑</b><span>任务</span></div>
  <div class="gutter" style="margin-top:20px;display:flex;flex-direction:column;gap:16px">
    <div class="screen"><div class="win"></div><div class="bar"></div><div class="hint">点画面进全屏</div></div>
    <div class="kv">
      <button class="btn btn-sm btn-primary"><svg class="i"><use href="#hand"/></svg>接管桌面</button>
      <button class="btn btn-sm btn-line"><svg class="i"><use href="#max"/></svg>全屏</button>
    </div>
    <div>
      <div class="group-title" style="padding-left:0">接管时的按键</div>
      <div class="keys">
        <span class="key"><svg class="i" style="width:16px;height:16px"><use href="#kbd"/></svg>键盘</span>
        <span class="key">Ctrl</span><span class="key">Alt</span><span class="key">Esc</span><span class="key">Tab</span>
        <span class="key"><svg class="i" style="width:16px;height:16px"><use href="#clip"/></svg>剪贴板</span>
        <span class="key"><svg class="i" style="width:16px;height:16px"><use href="#rotate"/></svg>横屏</span>
      </div>
    </div>
    <div class="group">
      <div class="cell"><span class="grow">分辨率</span><span class="val">1400 × 900</span></div>
    </div>
  </div>
  <div class="home-ind"></div>
</template>

<div class="row-label">深色</div>
<div class="grid" id="row-dark"></div>
<div class="row-label">浅色</div>
<div class="grid" id="row-light"></div>

<script>
  const screens = [['t-machines', '选机器（App 首页）'], ['t-chat', '聊天'], ['t-settings', '设置'], ['t-screen', '看屏 / 接管']];
  for (const theme of ['dark', 'light']) {
    const row = document.getElementById('row-' + theme);
    for (const [id, cap] of screens) {
      const wrap = document.createElement('div');
      const phone = document.createElement('div');
      phone.className = 'phone ' + theme;
      phone.appendChild(document.getElementById(id).content.cloneNode(true));
      const c = document.createElement('div');
      c.className = 'cap';
      c.textContent = cap;
      wrap.append(phone, c);
      row.appendChild(wrap);
    }
  }
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Nightshift</title>
<style>
  :root {
    --bg: #08090d; --panel: #10131a; --panel-2: #151a23; --border: #232a38;
    --text: #e7e9f0; --muted: #8b93a6; --dim: #5e6678;
    --accent: #7c5cff; --accent-2: #9a80ff;
    --green: #2fbf71; --amber: #f0a72c; --red: #ef5350;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--sans);
    display: flex; flex-direction: column; height: 100dvh;
  }

  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(10px + var(--safe-top)) 12px 10px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .icon-btn {
    width: 34px; height: 34px; flex: none; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 16px; line-height: 1;
  }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .machine { font-size: 11px; color: var(--dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; display: inline-block; margin-right: 5px; }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--red); }

  #bots { flex: none; display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--panel); }
  #bots[hidden] { display: none; }
  #bots button {
    flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--muted); font: 600 12.5px/1 var(--sans);
  }
  #bots button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .msg.assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .msg.system { align-self: center; background: transparent; color: var(--dim); font-size: 12px; text-align: center; }
  .msg.streaming::after { content: "▍"; color: var(--accent-2); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg pre {
    margin: 6px 0; padding: 9px 10px; border-radius: 9px; background: #0b0e14;
    border: 1px solid var(--border); overflow-x: auto; font: 12px/1.5 var(--mono); white-space: pre;
  }
  .msg code { font-family: var(--mono); font-size: 12.5px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 5px; }
  .msg pre code { background: none; padding: 0; }
  .msg .md-table { overflow-x: auto; max-width: 100%; margin: 6px 0; }
  .msg .md-table table { border-collapse: collapse; font-size: 12.5px; width: max-content; min-width: 100%; }
  .msg .md-table th, .msg .md-table td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; max-width: 22em; overflow-wrap: anywhere; }
  .msg .md-table th { background: rgba(255,255,255,.04); white-space: nowrap; }

  .card {
    align-self: stretch; border: 1px solid rgba(240, 167, 44, .35); background: rgba(240, 167, 44, .08);
    border-radius: 12px; padding: 11px 12px;
  }
  .card .title { font-weight: 650; font-size: 13.5px; margin-bottom: 4px; }
  .card .body { font-size: 12.5px; color: #e6c48b; overflow-wrap: anywhere; }
  .card .body pre { margin: 6px 0 0; padding: 8px; background: rgba(0,0,0,.25); border-radius: 8px; overflow-x: auto; font: 11.5px/1.5 var(--mono); }
  .card .row { display: flex; gap: 8px; margin-top: 10px; }
  .card button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px/1 var(--sans); }
  .card button.ok { background: var(--green); border-color: var(--green); color: #04170c; }
  .card button.no { background: transparent; color: var(--text); }
  .card.done { border-color: var(--border); background: var(--panel-2); }
  .card.done .body { color: var(--muted); }

  .banner { flex: none; padding: 8px 12px; font-size: 12.5px; background: rgba(239,83,80,.12); color: #ffb4b2; border-bottom: 1px solid rgba(239,83,80,.3); }
  .banner[hidden] { display: none; }

  footer {
    flex: none; padding: 8px 10px calc(8px + var(--safe-bottom));
    border-top: 1px solid var(--border); background: var(--panel);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #text {
    flex: 1; min-height: 42px; max-height: 140px; resize: none;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font: 14px/1.5 var(--sans); padding: 10px 12px; outline: none;
  }
  #text:focus { border-color: var(--accent); }
  #send {
    width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; font-size: 18px;
  }
  #send:disabled { opacity: .5; }

  .empty { margin: auto; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.8; padding: 24px; }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="back" type="button" aria-label="返回">✕</button>
  <div class="who">
    <div class="name" id="who-name">Nightshift</div>
    <div class="machine" id="who-machine"><span class="dot" id="who-dot"></span>—</div>
  </div>
  <button class="icon-btn" id="full" type="button" aria-label="完整界面" title="完整界面">⋯</button>
</header>

<div id="bots" hidden></div>
<div class="banner" id="banner" hidden></div>

<main id="messages"><div class="empty" id="empty">正在连接…</div></main>

<footer>
  <textarea id="text" rows="1" placeholder="给助理发消息…" autocomplete="off" spellcheck="false"></textarea>
  <button id="send" type="button" aria-label="发送">↑</button>
</footer>

<script src="chat.js"></script>
</body>
</html>

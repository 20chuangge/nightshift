apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Desk release signing — the keystore never lives in this repository.
//
//   DESK_KEYSTORE        path to the .jks / .keystore (required for a signed build)
//   DESK_KEY_ALIAS       key alias inside that keystore
//   DESK_KEY_PASSWORD    key password
//   DESK_STORE_PASSWORD  store password (optional; defaults to DESK_KEY_PASSWORD)
//   DESK_VERSION_CODE    versionCode override for CI (optional)
//   DESK_VERSION_NAME    versionName override for CI (optional)
//
// With no keystore in the environment, `assembleRelease` still runs but emits an
// UNSIGNED apk (app-release-unsigned.apk) — that is what CI uploads when the
// signing secrets are absent. See docs/BUILD-MOBILE.md.
// ---------------------------------------------------------------------------
def deskKeystore = System.getenv('DESK_KEYSTORE')
def deskKeyAlias = System.getenv('DESK_KEY_ALIAS')
def deskKeyPassword = System.getenv('DESK_KEY_PASSWORD')
def deskStorePassword = System.getenv('DESK_STORE_PASSWORD') ?: deskKeyPassword
def deskKeystoreFile = deskKeystore ? file(deskKeystore) : null
def hasDeskSigning = deskKeystoreFile != null &&
        deskKeystoreFile.exists() &&
        deskKeyAlias &&
        deskKeyPassword

// `toInteger()` (not `as Integer`) so the intent is unambiguous in Groovy.
// With no override, the version comes from the repository's package.json, so an
// APK built here or in CI reports the same version as the desktop installer.
def deskPackage = new groovy.json.JsonSlurper().parseText(file('../../../package.json').text)
def deskSemver = ((deskPackage.version ?: '0.0.0') + '.0.0').tokenize('.').take(3).collect {
    (it.replaceAll(/[^0-9].*$/, '') ?: '0').toInteger()
}
def deskVersionCode = (System.getenv('DESK_VERSION_CODE') ?: String.valueOf(
        deskSemver[0] * 10000 + deskSemver[1] * 1000 + deskSemver[2])).toInteger()
def deskVersionName = System.getenv('DESK_VERSION_NAME') ?: (deskPackage.version ?: '1.0')

android {
    namespace "com.desk.assistant"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.desk.assistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode deskVersionCode
        versionName deskVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasDeskSigning) {
        signingConfigs {
            release {
                storeFile deskKeystoreFile
                storePassword deskStorePassword
                keyAlias deskKeyAlias
                keyPassword deskKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasDeskSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

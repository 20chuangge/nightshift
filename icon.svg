<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nightshift · 夜班: a crescent moon with the bots' two eyes, on a night-indigo tile.
       Source of every app icon; render with: npm run desktop:icons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2a5c"/>
      <stop offset="1" stop-color="#1b1838"/>
    </linearGradient>
    <linearGradient id="moonLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd6ff"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="478" cy="540" r="300" fill="white"/>
      <circle cx="650" cy="400" r="262" fill="black"/>
    </mask>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#sky)"/>
  <rect x="40" y="40" width="944" height="944" rx="228" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
  <rect width="1024" height="1024" fill="url(#moonLight)" mask="url(#crescent)"/>
  <rect x="270" y="584" width="56" height="96" rx="28" fill="#221e46"/>
  <rect x="364" y="584" width="56" height="96" rx="28" fill="#221e46"/>
  <circle cx="724" cy="326" r="26" fill="#ffffff" fill-opacity=".9"/>
  <circle cx="822" cy="452" r="15" fill="#ffffff" fill-opacity=".6"/>
  <circle cx="636" cy="222" r="12" fill="#ffffff" fill-opacity=".5"/>
</svg>

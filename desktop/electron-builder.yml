appId: com.desk.assistant
productName: Evenlight
copyright: Copyright © 2026 Evenlight

directories:
  output: dist
  buildResources: build

# The Electron entry stays tiny: main.mjs + package.json.
# The agent is shipped alongside it as plain files (not inside asar) because the
# shell starts it with a separate Node process.
files:
  - main.mjs
  - shell-preload.cjs
  - recorder.html
  - package.json
  - build/icon.png
  - "!**/*.map"

extraResources:
  - from: ../src
    to: server/src
    filter: ["**/*.mjs", "**/*.cjs", "**/LICENSE"]
  - from: ../public
    to: server/public
  - from: ../config
    to: server/config
  - from: ../skills
    to: server/skills
  - from: ../workspace
    to: server/workspace
  - from: ../hub
    to: server/hub
  # ssh2 is pure JS when cpu-features is absent; keep its whole runtime tree
  # next to it so `node resources/server/src/server.mjs` can resolve them.
  # asn1 requires safer-buffer at load time -- do not drop it from this list.
  - from: ../node_modules/ssh2
    to: server/node_modules/ssh2
  - from: ../node_modules/asn1
    to: server/node_modules/asn1
  - from: ../node_modules/bcrypt-pbkdf
    to: server/node_modules/bcrypt-pbkdf
  - from: ../node_modules/tweetnacl
    to: server/node_modules/tweetnacl
  - from: ../node_modules/safer-buffer
    to: server/node_modules/safer-buffer
  - from: ../package.json
    to: server/package.json

asar: true
compression: normal
removePackageScripts: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  publisherName: Evenlight
  artifactName: Evenlight-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 长明 Evenlight
  deleteAppDataOnUninstall: false
  uninstallDisplayName: "长明 Evenlight"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: Evenlight-Setup-${version}.${ext}

portable:
  artifactName: Evenlight-Portable-${version}.${ext}

mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Utility
  synopsis: Personal AI assistant with its own computer

